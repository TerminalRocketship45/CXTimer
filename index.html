<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CXTimer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a1a;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      user-select: none;
    }

    #app {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 600ms ease;
    }

    /* Welcome */
    #welcome {
      font-size: 2.5rem;
      font-weight: 300;
      letter-spacing: 0.02em;
      opacity: 0;
      transition: opacity 1s ease;
      text-align: center;
    }

    /* Top bar */
    #topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 24px;
      z-index: 100;
    }

    #ms-label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: rgba(255,255,255,0.6);
      font-size: 0.85rem;
      cursor: pointer;
    }

    #ms-checkbox {
      width: 16px;
      height: 16px;
      accent-color: white;
      cursor: pointer;
    }

    #stop-flash-btn {
      display: none;
      color: white;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 6px;
      padding: 8px 18px;
      font-size: 0.85rem;
      cursor: pointer;
      font-family: inherit;
    }

    #stop-flash-btn:hover { background: rgba(255,255,255,0.25); }

    /* Prep area */
    #prep-area {
      position: fixed;
      top: 64px;
      left: 0; right: 0;
      display: none;
      justify-content: center;
      gap: 16px;
      z-index: 90;
    }

    .prep-btn {
      padding: 12px 24px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      font-size: 0.95rem;
      cursor: pointer;
      min-width: 170px;
      transition: all 200ms ease;
      font-family: inherit;
      color: white;
    }

    #aff-prep-btn { background: rgba(139,26,26,0.25); }
    #neg-prep-btn { background: rgba(26,77,46,0.25); }

    .prep-btn.running {
      border: 2px solid rgba(255,255,255,0.5);
    }

    .prep-btn.exhausted {
      background: rgba(255,255,255,0.05) !important;
      color: rgba(255,255,255,0.25);
      cursor: default;
      border: 1px solid rgba(255,255,255,0.05);
    }

    /* Main center */
    #main-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Circle button */
    #circle-btn {
      width: 250px;
      height: 250px;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
      border: 2px solid rgba(255,255,255,0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: white;
      transition: all 300ms ease;
      opacity: 1;
    }

    #circle-btn:hover {
      border-color: rgba(255,255,255,0.25);
    }

    #circle-step-name {
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    #circle-step-desc {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.5);
      margin-top: 6px;
      max-width: 160px;
      text-align: center;
      line-height: 1.3;
    }

    #circle-click-label {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.35);
      margin-top: 12px;
      letter-spacing: 0.06em;
    }

    /* Settings row */
    #settings-row {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-top: 32px;
      color: rgba(255,255,255,0.5);
      font-size: 0.85rem;
    }

    .settings-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #prep-minutes-input, #constructive-input, #rebuttal-input {
      width: 60px;
      padding: 6px 10px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      color: white;
      font-size: 1rem;
      text-align: center;
      outline: none;
      font-family: inherit;
    }

    /* Timer display */
    #timer-display {
      display: none;
      flex-direction: column;
      align-items: center;
    }

    #timer-digits {
      font-size: clamp(4rem, 11vw, 7.5rem);
      font-weight: 200;
      color: white;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
      line-height: 1;
    }

    #timer-label {
      color: rgba(255,255,255,0.4);
      font-size: 0.95rem;
      margin-top: 16px;
      letter-spacing: 0.05em;
    }

    /* Click hints */
    #click-continue {
      position: fixed;
      bottom: 48px;
      left: 0; right: 0;
      text-align: center;
      color: rgba(255,255,255,0.4);
      font-size: 0.9rem;
      letter-spacing: 0.03em;
      display: none;
    }

    #click-end-early {
      position: fixed;
      bottom: 48px;
      left: 0; right: 0;
      text-align: center;
      color: rgba(255,255,255,0.25);
      font-size: 0.85rem;
      letter-spacing: 0.03em;
      display: none;
    }

    /* Modal overlay */
    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }

    #modal-content {
      background: #222;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 32px 40px;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    #modal-content h2 {
      font-size: 1.3rem;
      font-weight: 500;
      margin-bottom: 12px;
      color: white;
    }

    #modal-content p {
      font-size: 0.95rem;
      color: rgba(255,255,255,0.6);
      margin-bottom: 28px;
      line-height: 1.5;
    }

    #modal-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .modal-btn {
      padding: 10px 24px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
      color: white;
      font-size: 0.95rem;
      cursor: pointer;
      font-family: inherit;
      transition: background 200ms ease;
    }

    .modal-btn:hover {
      background: rgba(255,255,255,0.15);
    }

    #confirm-end-btn {
      background: rgba(220,100,100,0.4);
      border-color: rgba(220,100,100,0.5);
    }

    #confirm-end-btn:hover {
      background: rgba(220,100,100,0.6);
    }

    /* Summary */
    #summary {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 600px;
      padding: 24px;
      max-height: 100vh;
      overflow-y: auto;
    }

    #summary h1 {
      font-size: 2rem;
      font-weight: 300;
      letter-spacing: 0.04em;
      margin-bottom: 8px;
    }

    #summary-subtitle {
      color: rgba(255,255,255,0.35);
      font-size: 0.85rem;
      margin-bottom: 28px;
    }

    #summary-log {
      width: 100%;
      margin-bottom: 32px;
    }

    .summary-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-radius: 8px;
      margin-bottom: 6px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
    }

    .summary-row-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }

    .summary-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .summary-step-name {
      font-size: 0.9rem;
      font-weight: 500;
      white-space: nowrap;
    }

    .summary-badge {
      font-size: 0.7rem;
      color: rgba(255,200,80,0.8);
      background: rgba(255,200,80,0.1);
      border: 1px solid rgba(255,200,80,0.2);
      border-radius: 4px;
      padding: 1px 6px;
      margin-left: 4px;
      white-space: nowrap;
    }

    .summary-row-right {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-left: 12px;
      flex-shrink: 0;
    }

    .summary-scheduled {
      color: rgba(255,255,255,0.3);
      font-size: 0.8rem;
    }

    .summary-time {
      color: rgba(255,255,255,0.75);
      font-size: 0.9rem;
      font-variant-numeric: tabular-nums;
      font-weight: 500;
      min-width: 44px;
      text-align: right;
    }

    .summary-time.prep {
      color: rgba(200,180,255,0.85);
    }

    #summary-prep {
      display: flex;
      gap: 32px;
      margin-bottom: 40px;
      color: rgba(255,255,255,0.55);
      font-size: 0.9rem;
    }

    #summary-prep strong { color: white; }

    #new-round-btn {
      padding: 14px 48px;
      border-radius: 8px;
      border: none;
      background: #0d6e6e;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      letter-spacing: 0.04em;
      font-family: inherit;
      font-weight: 500;
      transition: background 200ms ease;
    }

    #new-round-btn:hover { background: #0f8a8a; }
  </style>
</head>
<body>

<div id="app">

  <!-- Welcome -->
  <div id="welcome">Hey, Welcome to CXTimer!</div>

  <!-- Top bar -->
  <div id="topbar" style="display:none;">
    <label id="ms-label">
      <input type="checkbox" id="ms-checkbox" checked />
      Show milliseconds
    </label>
    <button id="stop-flash-btn">Stop Flashing</button>
  </div>

  <!-- Prep buttons -->
  <div id="prep-area">
    <button class="prep-btn" id="aff-prep-btn">AFF Prep — 8:00</button>
    <button class="prep-btn" id="neg-prep-btn">NEG Prep — 8:00</button>
  </div>

  <!-- Main center -->
  <div id="main-center">

    <!-- Circle button -->
    <button id="circle-btn">
      <span id="circle-step-name">1AC</span>
      <span id="circle-step-desc">Affirmative speech</span>
      <span id="circle-click-label">Click to start</span>
    </button>

    <!-- Settings row (before round starts) -->
    <div id="settings-row" style="display:none;">
      <div class="settings-group">
        <label>Prep time (min)</label>
        <input type="number" id="prep-minutes-input" value="8" min="0" max="99" />
      </div>
      <div class="settings-group">
        <label>Constructive (min)</label>
        <input type="number" id="constructive-input" value="8" min="1" max="99" />
      </div>
      <div class="settings-group">
        <label>Rebuttal (min)</label>
        <input type="number" id="rebuttal-input" value="5" min="1" max="99" />
      </div>
    </div>

    <!-- Timer display -->
    <div id="timer-display">
      <div id="timer-digits">8:00:00</div>
      <div id="timer-label">1AC — Affirmative speech</div>
    </div>

  </div>

  <!-- Click hints -->
  <div id="click-end-early">Click anywhere to end early</div>
  <div id="click-continue">Click anywhere to continue</div>

  <!-- Confirmation modal -->
  <div id="modal-overlay">
    <div id="modal-content">
      <h2>End early?</h2>
      <p>Are you sure you want to end this speech early?</p>
      <div id="modal-buttons">
        <button class="modal-btn" id="cancel-end-btn">Cancel</button>
        <button class="modal-btn" id="confirm-end-btn">End Now</button>
      </div>
    </div>
  </div>

  <!-- Summary -->
  <div id="summary">
    <h1>Round Complete</h1>
    <div id="summary-subtitle">Chronological timeline</div>
    <div id="summary-log"></div>
    <div id="summary-prep">
      <span>AFF Prep remaining: <strong id="summary-aff-prep">—</strong></span>
      <span>NEG Prep remaining: <strong id="summary-neg-prep">—</strong></span>
    </div>
    <button id="new-round-btn">Start New Round</button>
  </div>

</div>

<script>
(function() {

  // ─── State ────────────────────────────────────────────────────────────────
  let phase = "welcome";
  let currentStep = 0;
  let roundStarted = false;
  let showMs = true;

  let constructiveMins = 8;
  let rebuttalMins = 5;
  let prepMinutes = 8;
  let affPrep = 8 * 60 * 1000;
  let negPrep = 8 * 60 * 1000;
  let prepRunning = null;
  let prepStartTime = 0;
  let prepStartValue = 0;
  let prepRaf = null;

  let timerRaf = null;
  let timerStart = 0;
  let timerDuration = 0;
  let timeRemaining = 0;
  let warningApplied = false;

  let isFlashing = false;
  let flashInterval = null;
  let flashOn = true;

  let eventLog = [];
  let confirmingEarlyEnd = false;

  // ─── Dynamic step building ────────────────────────────────────────────────
  function buildSteps() {
    return [
      { name:"1AC",  desc:"Affirmative speech",        dur:constructiveMins*60, color:"#8b1a1a", colorDark:"#6e1515", type:"speech", team:"aff" },
      { name:"CX",   desc:"2nd Neg questions 1st Aff", dur:3*60,                color:"#3d1a5c", colorDark:"#2e1345", type:"cx" },
      { name:"1NC",  desc:"Negative speech",           dur:constructiveMins*60, color:"#1a4d2e", colorDark:"#143d24", type:"speech", team:"neg" },
      { name:"CX",   desc:"1st Aff questions 1st Neg", dur:3*60,                color:"#3d1a5c", colorDark:"#2e1345", type:"cx" },
      { name:"2AC",  desc:"Affirmative speech",        dur:constructiveMins*60, color:"#8b1a1a", colorDark:"#6e1515", type:"speech", team:"aff" },
      { name:"CX",   desc:"1st Neg questions 2nd Aff", dur:3*60,                color:"#3d1a5c", colorDark:"#2e1345", type:"cx" },
      { name:"2NC",  desc:"Negative speech",           dur:constructiveMins*60, color:"#1a4d2e", colorDark:"#143d24", type:"speech", team:"neg" },
      { name:"1NR",  desc:"Negative speech",           dur:rebuttalMins*60,     color:"#1a4d2e", colorDark:"#143d24", type:"speech", team:"neg" },
      { name:"1AR",  desc:"Affirmative speech",        dur:rebuttalMins*60,     color:"#8b1a1a", colorDark:"#6e1515", type:"speech", team:"aff" },
      { name:"2NR",  desc:"Negative speech",           dur:rebuttalMins*60,     color:"#1a4d2e", colorDark:"#143d24", type:"speech", team:"neg" },
      { name:"2AR",  desc:"Affirmative speech",        dur:rebuttalMins*60,     color:"#8b1a1a", colorDark:"#6e1515", type:"speech", team:"aff" },
    ];
  }

  let STEPS = buildSteps();

  // ─── DOM refs ─────────────────────────────────────────────────────────────
  const $app         = document.getElementById('app');
  const $welcome     = document.getElementById('welcome');
  const $topbar      = document.getElementById('topbar');
  const $msCheckbox  = document.getElementById('ms-checkbox');
  const $stopFlash   = document.getElementById('stop-flash-btn');
  const $prepArea    = document.getElementById('prep-area');
  const $affBtn      = document.getElementById('aff-prep-btn');
  const $negBtn      = document.getElementById('neg-prep-btn');
  const $mainCenter  = document.getElementById('main-center');
  const $circleBtn   = document.getElementById('circle-btn');
  const $stepName    = document.getElementById('circle-step-name');
  const $stepDesc    = document.getElementById('circle-step-desc');
  const $settingsRow = document.getElementById('settings-row');
  const $prepInput   = document.getElementById('prep-minutes-input');
  const $constructiveInput = document.getElementById('constructive-input');
  const $rebuttalInput = document.getElementById('rebuttal-input');
  const $timerWrap   = document.getElementById('timer-display');
  const $timerDigits = document.getElementById('timer-digits');
  const $timerLabel  = document.getElementById('timer-label');
  const $clickEndEarly = document.getElementById('click-end-early');
  const $clickCont   = document.getElementById('click-continue');
  const $summary     = document.getElementById('summary');
  const $sumLog      = document.getElementById('summary-log');
  const $sumAff      = document.getElementById('summary-aff-prep');
  const $sumNeg      = document.getElementById('summary-neg-prep');
  const $newRound    = document.getElementById('new-round-btn');
  const $modalOverlay = document.getElementById('modal-overlay');
  const $modalContent = document.getElementById('modal-content');
  const $cancelBtn   = document.getElementById('cancel-end-btn');
  const $confirmBtn  = document.getElementById('confirm-end-btn');

  // ─── Helpers ─────────────────────────────────────────────────────────────
  function pad(n, len=2) { return String(n).padStart(len, '0'); }

  function fmtTimer(ms, withMs) {
    const total = Math.max(0, ms);
    const m = Math.floor(total / 60000);
    const s = Math.floor((total % 60000) / 1000);
    const h = Math.floor((total % 1000) / 10);
    return withMs ? `${m}:${pad(s)}:${pad(h)}` : `${m}:${pad(s)}`;
  }

  function fmtPrep(ms) {
    const total = Math.max(0, Math.ceil(ms / 1000));
    const m = Math.floor(total / 60);
    const s = total % 60;
    return `${m}:${pad(s)}`;
  }

  function fmtSecs(secs) {
    if (secs == null) return "—";
    const m = Math.floor(secs / 60);
    const s = secs % 60;
    return `${m}:${pad(s)}`;
  }

  function setBg(color, instant=false) {
    if (instant) {
      $app.style.transition = 'none';
      $app.style.backgroundColor = color;
      void $app.offsetWidth;
      $app.style.transition = 'background-color 600ms ease';
    } else {
      $app.style.transition = isFlashing ? 'none' : 'background-color 600ms ease';
      $app.style.backgroundColor = color;
    }
  }

  function updatePrepBtns() {
    $affBtn.textContent = `AFF Prep — ${fmtPrep(affPrep)}`;
    $negBtn.textContent = `NEG Prep — ${fmtPrep(negPrep)}`;
    $affBtn.className = 'prep-btn';
    $negBtn.className = 'prep-btn';

    if (affPrep <= 0 && prepRunning !== 'aff') {
      $affBtn.classList.add('exhausted');
    } else if (prepRunning === 'aff') {
      $affBtn.classList.add('running');
      $affBtn.style.background = 'rgba(139,26,26,0.6)';
    } else {
      $affBtn.style.background = 'rgba(139,26,26,0.25)';
    }

    if (negPrep <= 0 && prepRunning !== 'neg') {
      $negBtn.classList.add('exhausted');
    } else if (prepRunning === 'neg') {
      $negBtn.classList.add('running');
      $negBtn.style.background = 'rgba(26,77,46,0.6)';
    } else {
      $negBtn.style.background = 'rgba(26,77,46,0.25)';
    }
  }

  function updateCircleGlow() {
    const step = STEPS[currentStep];
    $circleBtn.style.boxShadow = `inset 0 0 40px ${step.color}44, 0 0 20px ${step.color}22`;
  }

  // ─── Welcome sequence ────────────────────────────────────────────────────
  function startWelcome() {
    $welcome.style.display = '';
    $topbar.style.display = 'none';
    $mainCenter.style.display = 'none';
    $prepArea.style.display = 'none';
    $summary.style.display = 'none';
    setBg('#1a1a1a', true);

    setTimeout(() => { $welcome.style.opacity = '1'; }, 50);
    setTimeout(() => { $welcome.style.opacity = '0'; }, 3000);
    setTimeout(() => {
      $welcome.style.display = 'none';
      showIdleScreen();
    }, 4000);
  }

  // ─── Idle screen ─────────────────────────────────────────────────────────
  function showIdleScreen() {
    phase = 'idle';
    const step = STEPS[currentStep];

    $welcome.style.display = 'none';
    $summary.style.display = 'none';
    $topbar.style.display = 'flex';
    $mainCenter.style.display = 'flex';
    $timerWrap.style.display = 'none';
    $circleBtn.style.display = 'flex';
    $clickEndEarly.style.display = 'none';
    $clickCont.style.display = 'none';
    $stopFlash.style.display = 'none';

    $settingsRow.style.display = roundStarted ? 'none' : 'flex';
    const showPrep = roundStarted && step.type === 'speech';
    $prepArea.style.display = showPrep || prepRunning ? 'flex' : 'none';
    updatePrepBtns();

    $stepName.textContent = step.name;
    $stepDesc.textContent = step.desc;
    updateCircleGlow();

    setBg('#1a1a1a');
  }

  // ─── Timer ───────────────────────────────────────────────────────────────
  function startTimer() {
    if (prepRunning) stopPrep(prepRunning);

    phase = 'running';
    roundStarted = true;
    const step = STEPS[currentStep];

    $circleBtn.style.display = 'none';
    $settingsRow.style.display = 'none';
    $prepArea.style.display = 'none';
    $timerWrap.style.display = 'flex';
    $clickEndEarly.style.display = 'block';
    $timerLabel.textContent = `${step.name} — ${step.desc}`;
    $clickCont.style.display = 'none';

    setBg(step.color);
    warningApplied = false;

    timerDuration = step.dur * 1000;
    timerStart = performance.now();
    timeRemaining = timerDuration;
    $timerDigits.textContent = fmtTimer(timeRemaining, showMs);

    function tick() {
      const elapsed = performance.now() - timerStart;
      timeRemaining = Math.max(0, timerDuration - elapsed);
      $timerDigits.textContent = fmtTimer(timeRemaining, showMs);

      if (!warningApplied && timeRemaining <= 60000 && timeRemaining > 0) {
        warningApplied = true;
        setBg(step.colorDark);
      }

      if (timeRemaining <= 0) {
        $timerDigits.textContent = fmtTimer(0, showMs);
        timerEnd();
        return;
      }
      timerRaf = requestAnimationFrame(tick);
    }
    timerRaf = requestAnimationFrame(tick);
  }

  function timerEnd() {
    phase = 'ended';
    isFlashing = true;
    flashOn = true;
    $stopFlash.style.display = 'block';
    $clickEndEarly.style.display = 'none';
    $clickCont.style.display = 'block';

    const step = STEPS[currentStep];
    const actualSecs = STEPS[currentStep].dur;
    eventLog.push({ type: step.type, label: `${step.name} — ${step.desc}`, scheduledSecs: actualSecs, actualSecs, early: false, team: step.team || null, color: step.color });

    flashInterval = setInterval(() => {
      flashOn = !flashOn;
      $app.style.transition = 'none';
      $app.style.backgroundColor = flashOn ? step.colorDark : '#0a0a0a';
    }, 500);
  }

  function timerEndEarly(actualSecs) {
    phase = 'ended';
    isFlashing = false;
    flashOn = true;
    $stopFlash.style.display = 'none';
    $clickEndEarly.style.display = 'none';
    $clickCont.style.display = 'block';

    const step = STEPS[currentStep];
    eventLog.push({ type: step.type, label: `${step.name} — ${step.desc}`, scheduledSecs: STEPS[currentStep].dur, actualSecs: Math.round(actualSecs), early: true, team: step.team || null, color: step.color });

    $app.style.transition = 'none';
    $app.style.backgroundColor = step.colorDark;
    void $app.offsetWidth;
    $app.style.transition = 'background-color 600ms ease';
  }

  function stopFlashing() {
    if (flashInterval) { clearInterval(flashInterval); flashInterval = null; }
    isFlashing = false;
    flashOn = true;
    $stopFlash.style.display = 'none';
    const step = STEPS[currentStep];
    $app.style.transition = 'none';
    $app.style.backgroundColor = step.colorDark;
    void $app.offsetWidth;
    $app.style.transition = 'background-color 600ms ease';
  }

  // ─── End early flow ──────────────────────────────────────────────────────
  function showEndEarlyConfirm() {
    confirmingEarlyEnd = true;
    $modalOverlay.style.display = 'flex';
  }

  function cancelEndEarly() {
    confirmingEarlyEnd = false;
    $modalOverlay.style.display = 'none';
  }

  function confirmEndEarly() {
    confirmingEarlyEnd = false;
    $modalOverlay.style.display = 'none';
    if (timerRaf) { cancelAnimationFrame(timerRaf); timerRaf = null; }
    const elapsed = performance.now() - timerStart;
    const actualSecs = Math.round(Math.min(elapsed, timerDuration) / 1000);
    timerEndEarly(actualSecs);
  }

  // ─── Click to continue ───────────────────────────────────────────────────
  function handleClickContinue() {
    if (confirmingEarlyEnd) return;
    if (phase === 'running') {
      showEndEarlyConfirm();
      return;
    }
    if (phase !== 'ended') return;

    stopFlashing();

    if (currentStep >= STEPS.length - 1) {
      showSummary();
    } else {
      currentStep++;
      showIdleScreen();
    }
  }

  // ─── Prep ─────────────────────────────────────────────────────────────────
  function startPrep(team) {
    if (prepRunning === team) { stopPrep(team); return; }
    if (team === 'aff' && affPrep <= 0) return;
    if (team === 'neg' && negPrep <= 0) return;

    prepRunning = team;
    prepStartTime = performance.now();
    prepStartValue = team === 'aff' ? affPrep : negPrep;
    setBg('#1a2a3a');
    updatePrepBtns();

    function tick() {
      const elapsed = performance.now() - prepStartTime;
      const remaining = Math.max(0, prepStartValue - elapsed);
      if (team === 'aff') affPrep = remaining;
      else negPrep = remaining;
      updatePrepBtns();

      if (remaining <= 0) {
        const usedSecs = Math.round(prepStartValue / 1000);
        eventLog.push({ type: 'prep', label: team === 'aff' ? 'AFF Prep' : 'NEG Prep', scheduledSecs: null, actualSecs: usedSecs, early: false, team, color: team === 'aff' ? '#8b1a1a' : '#1a4d2e' });
        prepRunning = null;
        setBg('#1a1a1a');
        updatePrepBtns();
        return;
      }
      prepRaf = requestAnimationFrame(tick);
    }
    prepRaf = requestAnimationFrame(tick);
  }

  function stopPrep(team) {
    if (prepRaf) { cancelAnimationFrame(prepRaf); prepRaf = null; }
    const elapsed = performance.now() - prepStartTime;
    const remaining = Math.max(0, prepStartValue - elapsed);
    if (team === 'aff') affPrep = remaining;
    else negPrep = remaining;
    const usedSecs = Math.round((prepStartValue - remaining) / 1000);
    eventLog.push({ type: 'prep', label: team === 'aff' ? 'AFF Prep' : 'NEG Prep', scheduledSecs: null, actualSecs: usedSecs, early: false, team, color: team === 'aff' ? '#8b1a1a' : '#1a4d2e' });
    prepRunning = null;
    setBg('#1a1a1a');
    updatePrepBtns();
  }

  // ─── Summary ─────────────────────────────────────────────────────────────
  function showSummary() {
    phase = 'summary';
    setBg('#1a1a1a');
    $mainCenter.style.display = 'none';
    $clickCont.style.display = 'none';
    $prepArea.style.display = 'none';
    $stopFlash.style.display = 'none';

    // Build log from eventLog
    $sumLog.innerHTML = '';
    eventLog.forEach(entry => {
      const row = document.createElement('div');
      row.className = 'summary-row';
      let html = `
        <div class="summary-row-left">
          <div class="summary-dot" style="background:${entry.color}"></div>
          <span class="summary-step-name">${entry.label}</span>
      `;
      if (entry.early) {
        html += `<span class="summary-badge">ended early</span>`;
      }
      html += `</div><div class="summary-row-right">`;
      if (entry.scheduledSecs != null) {
        html += `<span class="summary-scheduled">of ${fmtSecs(entry.scheduledSecs)}</span>`;
      }
      html += `<span class="summary-time${entry.type === 'prep' ? ' prep' : ''}">${fmtSecs(entry.actualSecs)}</span>`;
      html += `</div>`;
      row.innerHTML = html;
      $sumLog.appendChild(row);
    });

    $sumAff.textContent = fmtPrep(affPrep);
    $sumNeg.textContent = fmtPrep(negPrep);

    $summary.style.display = 'flex';
  }

  // ─── Reset ───────────────────────────────────────────────────────────────
  function resetAll() {
    if (timerRaf) { cancelAnimationFrame(timerRaf); timerRaf = null; }
    if (prepRaf) { cancelAnimationFrame(prepRaf); prepRaf = null; }
    if (flashInterval) { clearInterval(flashInterval); flashInterval = null; }

    phase = 'welcome';
    currentStep = 0;
    roundStarted = false;
    showMs = true;
    constructiveMins = 8;
    rebuttalMins = 5;
    prepMinutes = 8;
    affPrep = 8 * 60 * 1000;
    negPrep = 8 * 60 * 1000;
    prepRunning = null;
    isFlashing = false;
    flashOn = true;
    eventLog = [];
    STEPS = buildSteps();

    $msCheckbox.checked = true;
    $prepInput.value = 8;
    $constructiveInput.value = 8;
    $rebuttalInput.value = 5;
    $welcome.style.opacity = '0';
    $welcome.style.transition = 'none';
    $welcome.style.display = '';
    $app.style.transition = 'none';
    $app.style.backgroundColor = '#1a1a1a';
    void $app.offsetWidth;
    $app.style.transition = 'background-color 600ms ease';
    $modalOverlay.style.display = 'none';

    setTimeout(() => startWelcome(), 50);
  }

  // ─── Events ──────────────────────────────────────────────────────────────
  $msCheckbox.addEventListener('change', () => {
    showMs = $msCheckbox.checked;
    if (phase === 'running' || phase === 'ended') {
      $timerDigits.textContent = fmtTimer(timeRemaining, showMs);
    }
  });

  $stopFlash.addEventListener('click', (e) => {
    e.stopPropagation();
    stopFlashing();
  });

  $circleBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (phase === 'idle') startTimer();
  });

  $circleBtn.addEventListener('mouseenter', () => {
    const step = STEPS[currentStep];
    $circleBtn.style.boxShadow = `inset 0 0 60px ${step.color}66, 0 0 30px ${step.color}33`;
    $circleBtn.style.borderColor = 'rgba(255,255,255,0.25)';
  });
  $circleBtn.addEventListener('mouseleave', () => {
    updateCircleGlow();
    $circleBtn.style.borderColor = 'rgba(255,255,255,0.12)';
  });

  $affBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!$affBtn.classList.contains('exhausted')) startPrep('aff');
  });

  $negBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!$negBtn.classList.contains('exhausted')) startPrep('neg');
  });

  $prepInput.addEventListener('input', () => {
    const v = Math.max(0, Math.min(99, parseInt($prepInput.value) || 0));
    prepMinutes = v;
    affPrep = v * 60 * 1000;
    negPrep = v * 60 * 1000;
    updatePrepBtns();
  });

  $constructiveInput.addEventListener('input', () => {
    const v = Math.max(1, Math.min(99, parseInt($constructiveInput.value) || 1));
    constructiveMins = v;
    STEPS = buildSteps();
  });

  $rebuttalInput.addEventListener('input', () => {
    const v = Math.max(1, Math.min(99, parseInt($rebuttalInput.value) || 1));
    rebuttalMins = v;
    STEPS = buildSteps();
  });

  $prepInput.addEventListener('click', (e) => e.stopPropagation());
  $constructiveInput.addEventListener('click', (e) => e.stopPropagation());
  $rebuttalInput.addEventListener('click', (e) => e.stopPropagation());
  $settingsRow.addEventListener('click', (e) => e.stopPropagation());

  $cancelBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    cancelEndEarly();
  });

  $confirmBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    confirmEndEarly();
  });

  $app.addEventListener('click', () => {
    handleClickContinue();
  });

  $newRound.addEventListener('click', (e) => {
    e.stopPropagation();
    resetAll();
  });

  // ─── Boot ─────────────────────────────────────────────────────────────────
  $mainCenter.style.display = 'none';
  startWelcome();

})();
</script>
</body>
</html>
